<div class="container">

  <!-- IZQUIERDA -->
  <app-chat-list
    [chats]="chats"
    (chatSelected)="selectChat($event)"
    (newChat)="addChat($event)">
  </app-chat-list>

  <!-- DERECHA -->
  @if (selectedChat) {
    <app-chat-window
      [chat]="selectedChat"
      [currentUser]="currentUser"
      (messageSent)="addMessage($event)">
    </app-chat-window>
  } @else {
    <div class="no-chat">
      <p>Seleccioná un chat</p>
    </div>
  }

</div>
