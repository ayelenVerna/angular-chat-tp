<div class="chat-input">

  <input
    type="text"
    placeholder="Escribí un mensaje..."
    [formControl]="messageControl"
    (keydown.enter)="sendMessage()"
  />

  <button
    (click)="sendMessage()"
    [disabled]="messageControl.invalid">
    Enviar
  </button>

</div>

@if (messageControl.invalid && messageControl.touched) {
  <small class="error">
    Escribí un mensaje
  </small>
}
